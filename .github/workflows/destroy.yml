name: Destroy AWS resources

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "destroy" to delete the app and all its data from AWS
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

jobs:
  destroy:
    if: ${{ github.event.inputs.confirm == 'destroy' && vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform destroy
        working-directory: infra/terraform
        env:
          TF_VAR_region: ${{ env.AWS_REGION }}
        run: |
          mkdir -p ../../build && echo placeholder > /tmp/p && zip -j ../../build/lambda.zip /tmp/p
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=secure-share/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"
          terraform destroy -input=false -auto-approve
