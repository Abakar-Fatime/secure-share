AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One-time setup for secure-share. Lets GitHub Actions deploy to this AWS account
  without any stored access keys (OpenID Connect), and creates the bucket that keeps
  Terraform state. Create this stack once from the CloudFormation console.

Parameters:
  GitHubRepo:
    Type: String
    Default: Abakar-Fatime/secure-share
    Description: owner/repository allowed to deploy
  CreateOIDCProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to false if this account already has the GitHub OIDC provider

Conditions:
  MakeProvider: !Equals [!Ref CreateOIDCProvider, "true"]

Resources:
  GitHubOIDC:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  StateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub "secure-share-tfstate-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: secure-share-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only workflows running on the main branch of this repository.
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepo}:ref:refs/heads/main"
      Policies:
        - PolicyName: deploy-secure-share
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: TerraformState
                Effect: Allow
                Action: [s3:ListBucket, s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource:
                  - !GetAtt StateBucket.Arn
                  - !Sub "${StateBucket.Arn}/*"
              - Sid: AppBuckets
                Effect: Allow
                Action: s3:*
                Resource:
                  - arn:aws:s3:::secure-share-files-*
                  - arn:aws:s3:::secure-share-web-*
              - Sid: AppServices
                Effect: Allow
                Action:
                  - dynamodb:*
                  - lambda:*
                  - apigateway:*
                  - cloudfront:*
                  - logs:*
                  - budgets:*
                Resource: "*"
              - Sid: AppRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/secure-share-api"

Outputs:
  DeployRoleArn:
    Description: Save as the AWS_DEPLOY_ROLE_ARN variable in the GitHub repository
    Value: !GetAtt DeployRole.Arn
  StateBucketName:
    Description: Save as the TF_STATE_BUCKET variable in the GitHub repository
    Value: !Ref StateBucket
